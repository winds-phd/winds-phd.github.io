<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student registration · WiNDS Lab Research Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css?v=20261109-1525">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-brand">
      <div class="label">Student sign-up</div>
      <h1>Join your supervisor's group</h1>
      <p>You'll need the lab code from your supervisor. You'll sign in with your admission number and the password you choose here.</p>
    </div>

    <section class="panel" id="card">
      <form id="regForm" novalidate>
        <div class="row">
          <label class="fieldlabel">Lab code (from your supervisor)<input id="code" required maxlength="12" autocomplete="off"></label>
          <label class="fieldlabel">Admission number<input id="adm" required maxlength="40" autocomplete="username" placeholder="e.g. 22DR0123"></label>
        </div>
        <div class="row">
          <label class="fieldlabel">Password<input id="secret" type="password" required minlength="6" autocomplete="new-password"></label>
          <label class="fieldlabel">Repeat password<input id="secret2" type="password" required minlength="6" autocomplete="new-password"></label>
        </div>
        <div class="row">
          <label class="fieldlabel">Full name<input id="name" required maxlength="80"></label>
          <label class="fieldlabel">Email (for resetting your password)<input id="email" type="email" required maxlength="120" autocomplete="email"></label>
        </div>
        <label class="fieldlabel">Thesis / project topic<input id="topic" maxlength="200" placeholder="Working title"></label>
        <div class="row">
          <label class="fieldlabel">Admission year<input id="year" type="number" min="1990" max="2100"></label>
          <label class="fieldlabel">Course<select id="stage"></select></label>
        </div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn block" type="submit" id="btn">Create my account</button>
      </form>
    </section>

    <p class="auth-foot">Already registered? <a href="student-login.html">Student sign-in</a> · <a href="index.html">Back</a></p>
  </div>
</div>

<script type="module">
  import { registerStudent, authMessage, configured, setupNotice } from "./assets/core.js?v=20261109-1525";
  if (!configured) setupNotice(document.getElementById("card"));
  const STAGES = ["PhD", "Masters", "B-Tech"];  // course; saved in the record as the student's course
  const $ = id => document.getElementById(id);
  for (const s of STAGES) { const o = document.createElement("option"); o.value = o.textContent = s; $("stage").append(o); }

  $("regForm")?.addEventListener("submit", async e => {
    e.preventDefault(); $("err").textContent = "";
    const v = id => $(id).value.trim();
    if (!v("code") || !v("adm") || !v("name")) { $("err").textContent = "Fill in the lab code, your admission number and your name."; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email"))) { $("err").textContent = "Enter a valid email. It's used if you ever forget your password."; return; }
    if ($("secret").value.length < 6) { $("err").textContent = "Your password must be at least 6 characters."; return; }
    if ($("secret").value !== $("secret2").value) { $("err").textContent = "The two passwords don't match."; return; }
    $("btn").disabled = true;
    try {
      await registerStudent({ code: v("code"), adm: v("adm"), secret: $("secret").value, name: v("name"), email: v("email"), topic: v("topic"), year: v("year"), stage: $("stage").value });
      location.href = "student.html";
    } catch (err) { $("err").textContent = authMessage(err); }
    finally { $("btn").disabled = false; }
  });
</script>
</body>
</html>
