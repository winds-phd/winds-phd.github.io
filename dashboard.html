<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisor Dashboard · WiNDS Lab Research Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css?v=20261109-2200">
<script src="assets/theme.js?v=20261109-2200"></script>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="index.html" aria-label="WiNDS Lab Research Tracking, home">
      <span class="brand-mark" aria-hidden="true">W</span>
      <span class="brand-text"><b>WiNDS Lab</b><span>Research Tracking</span></span>
    </a>
    <div class="appbar-right">
      <div id="themeSlot"></div>
      <div class="account" id="account" hidden>
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="acct-text"><b id="acctName"></b><span id="acctRole"></span></span>
      </div>
      <button class="btn ghost small signout" type="button" id="signOutBtn">Sign out</button>
    </div>
  </div>
</header>
<div class="app">
  <header class="top">
    <div>
      <div class="label" id="page-eyebrow">Supervisor dashboard</div>
      <h1 id="page-title">Research group</h1>
      <p id="page-sub">Tasks, papers and meetings for every student in the lab. Each student sees only their own.</p>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="layout">
    <aside class="roster">
      <div class="roster-head"><span class="label">Dashboard</span></div>
      <div class="roster-list" id="roster"></div>
      <section class="panel" id="joinPanel">
        <div class="label">Lab code</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b class="mono" id="joinShow" style="font-size:1.3rem;letter-spacing:0.12em">—</b><button class="btn ghost small" type="button" id="joinEditBtn">Change</button></div>
        <form id="joinForm" hidden><label class="fieldlabel">New lab code (4–12 letters or digits)<input id="joinNew" maxlength="12" autocomplete="off"></label><div class="row"><button class="btn small" type="submit">Save code</button><button class="btn ghost small" type="button" id="joinCancel">Cancel</button></div></form>
        <div class="label" style="margin-top:6px">Student sign-up link</div>
        <p class="note">Send students this link and the lab code. Without the code, nobody can create an account.</p>
        <code id="signupUrl" class="signup-url"></code>
        <button class="btn ghost small" type="button" id="copySignup">Copy link</button>
      </section>
    </aside>
    <main class="detail" id="detail"></main>
  </div>
</div>
<div id="status" role="status" hidden></div>
<script>
  if (location.protocol === "file:") document.getElementById("detail").innerHTML = '<div class="empty"><h3>Open the website address</h3><p>This page was opened as a file. Open your GitHub Pages address (https://YOUR-NAME.github.io/REPO/) instead.</p></div>';
</script>
<script type="module">
  import { start } from "./assets/tracker.js?v=20261109-2200";
  start("supervisor");
</script>
</body>
</html>
