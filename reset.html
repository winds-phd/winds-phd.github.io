<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose a new code · WiNDS Lab Research Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css?v=20261109-2130">
<script src="assets/theme.js?v=20261109-2130"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="label">Reset</div>
      <h1>Choose a new password</h1>
      <p>Your tasks, papers and meetings stay exactly as they were. Supervisors: this sets your new password (8+ characters).</p>
    </div>
    <section class="panel" id="card">
      <form id="form" novalidate>
        <label class="fieldlabel">New password<input id="s1" type="password" required minlength="6" autocomplete="new-password"></label>
        <label class="fieldlabel">Repeat it<input id="s2" type="password" required minlength="6" autocomplete="new-password"></label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn block" type="submit" id="btn">Save and sign in</button>
      </form>
    </section>
    <p class="auth-foot"><a href="index.html">Back to start</a></p>
  </div>
</div>
<script type="module">
  import { configured, resetWithToken, isSupervisor, authMessage, setupNotice } from "./assets/core.js?v=20261109-2130";
  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get("t");
  // Drop the token from the address bar so it isn't left in history or shared by accident.
  if (token) history.replaceState(null, "", location.pathname);
  if (!configured) setupNotice($("card"));
  else if (!token) $("card").innerHTML = '<div class="empty"><h3>This link is incomplete</h3><p>Open the link from your email again, or <a href="forgot.html">ask for a new one</a>.</p></div>';
  $("form")?.addEventListener("submit", async e => {
    e.preventDefault(); $("err").textContent = "";
    if ($("s1").value.length < 6) { $("err").textContent = "Use at least 6 characters."; return; }
    if ($("s1").value !== $("s2").value) { $("err").textContent = "The two entries don't match."; return; }
    $("btn").disabled = true;
    try { const u = await resetWithToken(token, $("s1").value); location.href = isSupervisor(u) ? "dashboard.html" : "student.html"; }
    catch (err) {
      $("err").innerHTML = "";
      $("err").append(authMessage(err) + " ");
      if (err.code === "expired") { const a = document.createElement("a"); a.href = "forgot.html"; a.textContent = "Send a new link"; $("err").append(a); }
      $("btn").disabled = false;
    }
  });
</script>
</body>
</html>
